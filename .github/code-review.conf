# Per-repo overrides for the agent code-review action.
# Read by config/claude/skills/agent-code-review-setup/install.sh, which renders
# them into .github/workflows/code-review.yml. Unknown keys are fatal.

# TEMPORARY — drops to 3 once PR #2 merges.
#
# The cap counts marker-bearing reviews already posted on a given PR, so it is
# per-PR-number and does not reset on close/reopen. PR #2 has 5 banked. Under the
# action's default of 5 its last four commits — the fixes for the findings of
# rounds 1-5 — were never reviewed at all: each push completed green having
# spawned no engine, which is indistinguishable from a clean review unless you
# read `reviewed`. 6 buys that PR exactly one more round and then hard-stops,
# rather than leaving the cap open and trusting nobody pushes again.
MAX_REVIEW_ROUNDS=6
