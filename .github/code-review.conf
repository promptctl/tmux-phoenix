# Per-repo overrides for the agent code-review action.
# Read by config/claude/skills/agent-code-review-setup/install.sh, which renders
# them into .github/workflows/code-review.yml. Unknown keys are fatal.

# The cap counts reviews already posted on one PR, so it is per-PR-number: every
# new PR starts at zero and gets three rounds, and closing and reopening a PR
# does not reset its count.
#
# Worth knowing before raising or lowering this: a PR that reaches its cap does
# not fail. Further pushes complete with conclusion "success" having spawned no
# engine, so a spent cap is indistinguishable from a clean review unless the
# caller reads the run's `reviewed` field. That is not hypothetical here — PR #2
# ran past a cap of 5 and its last four commits, the fixes for the findings of
# rounds 1-5, were never reviewed at all.
#
# 3 is the deliberate trade: a slice that cannot be brought home in three rounds
# is telling you it is too big to review in one PR, which is the more useful
# signal than quietly buying more rounds.
MAX_REVIEW_ROUNDS=3
