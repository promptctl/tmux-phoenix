# The gate that keeps this repo rustfmt-clean.
#
# Deliberately NOT a step inside code-review.yml, the repo's other workflow.
# That file is generated by the agent-code-review-setup skill from a template
# held in a different repository, and its own header records that the installer
# reconverges it on every run and overwrites local edits silently. A fmt step
# added there would work until the next install and then vanish without a
# failure — the worst shape a check can have. This file has no generator; this
# repo owns it outright. [LAW:one-source-of-truth]
#
# Scope, stated plainly so a green check is not read as more than it is: this
# workflow gates FORMATTING ONLY. Nothing here builds the crate, runs the 139
# tests, or runs clippy. Those want a decision this workflow does not make —
# the test suite spawns real `tmux -C` servers, so gating it means first
# settling what tmux the runner has — and they belong to their own ticket.
name: CI

# Two triggers because there are two roads into main. `pull_request` covers the
# normal one; `push` covers committing straight to main, which this repo's
# workflow explicitly permits and which is how the drift that motivated this
# check arrived — two files that were never anyone's PR. A checkpoint standing
# on one of two entrances is not a checkpoint. [LAW:single-enforcer]
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Formatting compiles nothing; a run that has not finished in five minutes
    # is stuck, not slow.
    timeout-minutes: 5
    steps:
      - name: Checkout
        # SHA-pinned, matching code-review.yml's pin of the same action and for
        # the same reason recorded there: checkout is third-party code fetched
        # over the network on every run, fork PRs included, so a moving tag
        # would execute a future compromised release automatically. The two
        # files repeat the pin because Actions offers no way to share a `uses:`
        # ref, and they answer to different owners — that one is generated
        # elsewhere, this one is not — so there is no declaration to share.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches over authenticated git, so there is
          # no reason to leave GITHUB_TOKEN sitting in .git/config inside the
          # checked-out tree.
          persist-credentials: false

      # No toolchain-setup step: the ubuntu-latest image ships cargo, rustup and
      # rustfmt preinstalled (Rust 1.98.1 / Rustfmt 1.9.0 on Ubuntu 24.04, as of
      # 2026-09), so installing one would add a network dependency to a check
      # that compiles nothing.
      #
      # The runner's rustfmt therefore floats, and will usually sit ahead of the
      # one a contributor runs locally. That is safe rather than lucky: rustfmt
      # promises not to change the formatting of already-formatted code within a
      # style edition, and this workspace is edition 2021. Should that promise
      # ever break, the result is this job going red with the offending diff
      # printed in the log — loud and locatable, which is the whole point of
      # having the check. [LAW:no-silent-failure]
      - name: cargo fmt --check
        run: cargo fmt --all --check
